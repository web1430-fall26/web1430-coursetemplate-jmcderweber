<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="calculator.js" defer></script>


<header>
    <h1>Assignment 2 - Bill Splitter</h1>
</header>

<form>
    <h2>Enter Bill Details</h2>
        <label for="BillAmount">Bill Amount:</label>
        <input type="number" id="BillAmount" name="BillAmount" required> <br>

        <label for="PeopleNumber">Number of People:</label>
        <input type="number" id="PeopleNumber" name="PeopleNumber" required> <br>

        <label for="TipPercentage">Tip Percentage:</label>
        <input type="number" id="TipPercentage" name="TipPercentage" required> <br>

        <button type="button">Submit</button>
</form>

        <section>
            <h2>Calculation Result</h2>
            <div id="result" aria-live="polite"></div> <!-- aria-live="polite" means screen readers will announce updates politely -->
        </section> 

</body>
</html>
